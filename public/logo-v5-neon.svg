<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700&amp;display=swap');
    .text { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 700; }
  </style>

  <!-- PASSPORT ICON GROUP -->
  <g transform="translate(10, 10)">
    <!-- Back Cover / Pages -->
    <path d="M15 10 H85 A5 5 0 0 1 90 15 V95 A5 5 0 0 1 85 100 H15 A5 5 0 0 1 10 95 V15 A5 5 0 0 1 15 10 Z" fill="#B388FF"/>
    <path d="M12 12 H82 A5 5 0 0 1 87 17 V97 A5 5 0 0 1 82 102 H12 A5 5 0 0 1 7 97 V17 A5 5 0 0 1 12 12 Z" fill="#D1C4E9"/>
    
    <!-- Main Cover -->
    <rect x="5" y="5" width="80" height="100" rx="8" fill="#311B92" />
    <!-- Spine -->
    <path d="M5 5 H15 V105 H5 A8 8 0 0 1 5 105 V5 Z" fill="#000000" fill-opacity="0.3"/>
    
    <!-- Globe -->
    <circle cx="45" cy="55" r="22" fill="#4527A0" />
    <path d="M45 33 C45 33 55 40 55 55 C55 70 45 77 45 77" stroke="#00E5FF" stroke-width="2" fill="none"/>
    <path d="M45 33 C45 33 35 40 35 55 C35 70 45 77 45 77" stroke="#00E5FF" stroke-width="2" fill="none"/>
    <path d="M24 55 H66" stroke="#00E5FF" stroke-width="2"/>
  </g>

  <!-- PAPER PLANE -->
  <path d="M75 75 L110 55 L85 45 L75 75 Z" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M85 45 L92 63 L110 55" fill="#00B8D4"/>
  
  <!-- Motion Trail -->
  <path d="M35 85 Q 55 105 100 80" stroke="#00E5FF" stroke-width="3" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>

  <!-- TEXT -->
  <text x="130" y="55" class="text" font-size="32" fill="#D500F9">NOTA</text>
  <text x="130" y="85" class="text" font-size="32" fill="#00E5FF">MERICAN</text>
</svg>
